name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      channel:
        description: prefix.dev channel to upload to
        required: true
        default: mojo-force

jobs:
  conda:
    name: Build conda package
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.11.0
        with:
          cache: true
          environments: build
      - name: Build the conda package
        run: pixi run -e build build-conda
      - uses: actions/upload-artifact@v4
        with:
          name: conda-package
          path: output/**/*.conda

  publish:
    # Needs PREFIX_API_KEY. Kept in its own job so that a missing key, or a
    # prefix.dev outage, cannot stop the GitHub release from going out.
    name: Publish conda package
    runs-on: ubuntu-latest
    needs: [conda]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.11.0
        with:
          cache: true
          environments: build
      - uses: actions/download-artifact@v4
        with:
          name: conda-package
          path: output
      - name: Upload to prefix.dev
        env:
          PREFIX_API_KEY: ${{ secrets.PREFIX_API_KEY }}
          CHANNEL: ${{ inputs.channel || 'mojo-force' }}
        run: pixi run -e build publish

  docs:
    name: Deploy docs
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: prefix-dev/setup-pixi@v0.11.0
        with:
          cache: true
          environments: docs
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Deploy to GitHub Pages
        run: pixi run -e docs mkdocs gh-deploy --force

  github-release:
    name: GitHub release
    runs-on: ubuntu-latest
    needs: [conda]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: conda-package
          path: output
      - name: Attach the package to the release
        uses: softprops/action-gh-release@v2
        with:
          files: output/**/*.conda
          generate_release_notes: true
