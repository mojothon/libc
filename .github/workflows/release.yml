name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      channel:
        description: prefix.dev channel to upload to
        required: true
        default: mojo-force

jobs:
  conda:
    # One package per platform. The library binds both Linux's and Darwin's
    # C libraries, and the workspace declares both platforms, so a release
    # that only shipped `linux-64` left macOS readers with an install page
    # describing a package their platform's subdir does not have.
    name: Build conda package (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # `macos-14` retired as a runner image on 2026-11-02 and answers
        # nothing; `macos-15` is the same Apple Silicon, one Darwin up.
        # The ARM runner is the third machine the constants were asked
        # of, and its subdir -- `linux-aarch64` -- is one the workspace
        # has declared since they were: a release without it ships the
        # numbering the ARM ABI took the other side of as if there were
        # one answer.
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-15]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.11.0
        with:
          cache: true
          environments: build
      - name: Build the conda package
        run: pixi run -e build build-conda
      - uses: actions/upload-artifact@v4
        with:
          name: conda-package-${{ matrix.os }}
          path: output/**/*.conda

  publish:
    # Needs PREFIX_API_KEY. Kept in its own job so that a missing key, or a
    # prefix.dev outage, cannot stop the GitHub release from going out.
    name: Publish conda package
    runs-on: ubuntu-latest
    needs: [conda]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.11.0
        with:
          cache: true
          environments: build
      - uses: actions/download-artifact@v4
        with:
          # Both platforms: each artifact keeps its own subdir
          # (`linux-64/`, `osx-arm64/`), which is the layout `publish.sh`
          # globs and the layout prefix.dev wants.
          pattern: conda-package-*
          merge-multiple: true
          path: output
      - name: Upload to prefix.dev
        env:
          PREFIX_API_KEY: ${{ secrets.PREFIX_API_KEY }}
          CHANNEL: ${{ inputs.channel || 'mojo-force' }}
        run: pixi run -e build publish

  channel:
    # An upload that said done is not a package a user can ask the
    # channel for. The repodata is the channel's own word about what it
    # holds, and this is the release read back from it -- every
    # platform the matrix built, the version this tag names. The index
    # can take a minute to catch up with the upload, so the asking
    # waits and asks again before it believes an absence.
    name: The channel answers
    runs-on: ubuntu-latest
    needs: [publish]
    steps:
      - uses: actions/checkout@v4
      - name: Ask the repodata for the version just published
        env:
          CHANNEL: ${{ inputs.channel || 'mojo-force' }}
        run: |
          VERSION=$(python3 -c "import re; print(re.search(r'version = \"([^\"]+)\"', open('pixi.toml').read()).group(1))")
          for PLATFORM in linux-64 linux-aarch64 osx-arm64; do
            python3 scripts/ask-channel.py "$PLATFORM" "$VERSION" "$CHANNEL"
          done

  reader:
    # Every link before this one is a claim about parts: the package
    # builds, the upload lands, the repodata holds the version, the
    # download opens. What a reader does is none of those -- an empty
    # directory, pixi, the channels the install page names, and a call
    # to the library. The journey is walked once per release, on the
    # machine class a reader most likely has, by the page's own words.
    name: The install page, walked
    runs-on: ubuntu-latest
    needs: [channel]
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.11.0
        with:
          cache: false
      - name: Ask for the release the way a reader does
        run: |
          VERSION=$(python3 -c "import re; print(re.search(r'version = \"([^\"]+)\"', open('pixi.toml').read()).group(1))")
          bash scripts/ask-install.sh "$VERSION"

  docs:
    name: Deploy docs
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # CI deploys the site on every push to main; a tag then deploys the same
    # tree again. One group, so the two never push gh-pages at once.
    concurrency:
      group: pages
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: prefix-dev/setup-pixi@v0.11.0
        with:
          cache: true
          environments: docs
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Deploy to GitHub Pages
        run: pixi run -e docs mkdocs gh-deploy --force

  github-release:
    name: GitHub release
    # `workflow_dispatch` has no tag to hang a release on; the packages are
    # still built and published from a manual run.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    needs: [conda]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: conda-package-*
          merge-multiple: true
          path: output
      - name: Attach the packages to the release
        uses: softprops/action-gh-release@v2
        with:
          files: output/**/*.conda
          generate_release_notes: true
