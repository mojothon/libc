name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.11.0
        with:
          cache: true
      - name: mojo format
        run: pixi run format-check
      - name: C prototypes
        run: pixi run check-prototypes
      # A binding is a string and a signature, and two modules can hold the
      # same string with two signatures that agree today: `strlen` answered
      # `UInt64` in one and `Int` in the other. One file per symbol, and a
      # re-export where a second door is wanted. One signature per symbol
      # too, in one file or across two: `fcntl` bound twice compiled twice
      # and failed only where a program called both.
      - name: Check that each symbol is bound once, in one signature
        run: pixi run check-duplicates
      # The docs are the one place a call is written and nothing compiles it:
      # a rename leaves an example a reader finds before a test does.
      - name: Check that the examples in the docs compile
        run: pixi run check-examples
      # Every public name imported by name, in a process of its own. It has
      # to be its own process: imported from the runner, Mojo resolves the
      # names a function body uses and these bodies use none of them, so the
      # imports are dropped and a name that no longer exists goes unnoticed.
      - name: Check that every public name still resolves
        run: pixi run test-imports
      # A comparison answers a sign, and `!= 0` is the half of that answer
      # which survives the two arguments being handed over swapped -- the
      # shape seven of the sampled survivors had. This asks it of all of them.
      - name: Check that every comparison is asked which way it leans
        run: pixi run check-comparisons
      - name: Check that every tolerance is held to the whole difference
        run: pixi run check-magnitudes
      # Everything above asks whether a binding is right. This asks whether
      # anything ever calls it, which is a different question and the one
      # `gl_flags` was on the wrong side of.
      - name: Check that every binding is asked something
        run: pixi run check-tests
      # A release bumps the version in the five places that state it. Four
      # of them remembered is a package that builds and an install page
      # that sends readers to a release that is no longer the one shipped.
      - name: Check that the version is said the same everywhere
        run: pixi run check-release
      # The install page asked for the package on `-c mojo-force`, which conda
      # reads as an anaconda.org channel and answers with a 404, while the
      # package was on prefix.dev behind a URL. A shell command compiles
      # nowhere, so this asks what can be asked without the network.
      - name: Check that every channel the docs name can resolve
        run: pixi run check-channels
      # The two tables of reasons in the probe excuse a survivor, so an entry
      # that outlives the pair it was written for excuses nothing. This asks
      # only that the pair can still be made, and takes seconds.
      - name: Check that every reason in the probe still has a pair
        run: pixi run mutation-tables
      # The probe finds a branch's answer by walking the branches in
      # order, each after the one before it -- `4` is the first digit of
      # `4103`, and a walk that takes the first hit mutates the branch
      # the machine never reads. This asks, of every constant mutant,
      # that the literal the mistake changes is the one it names.
      - name: Check that every constant mutant lands on the literal it names
        run: pixi run check-walk

  checks:
    # Each check above is a claim that something bad would be caught, and
    # nothing checked the claim: `check-channels` spent its first ten
    # minutes passing by finding no channel names at all. This breaks one
    # thing at a time on a copy of the tree and asks the check that owns
    # it to say so. A hundred seconds, which is its own job rather than
    # one more step of the lint job for exactly that reason.
    name: The checks themselves
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.11.0
        with:
          cache: true
      - name: Check that each check fails on a tree that is wrong
        run: pixi run check-checks
      - name: Check that the mutation tables answer pairs that can still be made
        # The tables excuse a pair as being one call or the same answer, and
        # a test can catch up to what was written: an entry about a mutant
        # that the tests now tell apart reads as an answer when it is a
        # hole. This is what keeps a written answer from outliving the pair
        # it excuses, and it is cheap -- no mutant is built or run.
        run: pixi run mutation-tables
      - name: Ask the probe of the two mutants the answer is known for
        # The probe is what grades everything else, and a verdict that
        # misread -- a caught one called unobservable, a survivor called
        # caught -- would read as an honest answer to every question
        # asked after it. Two mutants whose answers the sweep has
        # settled on this machine are asked of it: one the check
        # against C refuses, one the tables carry with a reason.
        run: pixi run mutation-self

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # `macos-15`: `macos-14` was retired as a runner image on 2026-11-02
        # and now hands this repository no runners at all — jobs are cancelled
        # with no step ever having started, which reads as a red build that
        # tested nothing. `macos-15` is the same Apple Silicon and the nearest
        # living Darwin, and `macos-latest` is left alone for the same reason
        # the older comment here gave: a moving label that has already, once,
        # sat queued and answered with nothing. The newer Darwin may answer
        # some calls differently from the 14 the answers were pinned on; where
        # it does, the test says so, and the pin moves again.
        # `ubuntu-24.04-arm`: the third machine the answers are checked on,
        # and the first that shares its operating system with another in the
        # matrix. The glibc constants the tests pin are asked again here,
        # because some of them differ by architecture rather than by
        # operating system, and a constant asserted on x86-64 is a constant
        # believed on faith everywhere else.
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-15]
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.11.0
        with:
          cache: true
      - name: Check constants against the headers
        run: pixi run check-constants
      # Same reason again, and not for the same numbers: a struct that is
      # the wrong size here is wrong differently on each platform.
      - name: Check struct sizes against the headers
        run: pixi run check-layouts
      # A header can declare a symbol the library does not export, and the
      # headers on both platforms do: the prototypes above cannot tell, so
      # this asks `nm` what is actually there to be called.
      - name: Check that every called symbol is exported
        run: pixi run check-symbols
      # Nothing else reads what these say they return, so a wrong one is a
      # wrong one forever: fifteen here answered with bytes or a descriptor
      # while promising 0 meant success, `fork` among them.
      - name: Check documented return values against the headers
        run: pixi run check-return-values
      # The same for the rest of each docstring: every argument it names,
      # and the prototype it puts its name to. Found `atan` describing
      # itself as `atan2`, arguments and all.
      - name: Check docstrings against the call they describe
        run: pixi run check-docstrings
      # The header checks come first: a struct the two platforms lay out
      # differently fails here, naming the member, where the suite would fail
      # somewhere downstream of the same mistake.
      - name: Run the test suite
        # A test that waits for something never to arrive would hold the
        # job for six hours, and none of the log is readable until it
        # lets go — including the line saying which suite it was in.
        # The whole thing takes a minute here and a few on the runner,
        # so twenty is room rather than a limit.
        timeout-minutes: 20
        run: pixi run test
      # Every build printed sixteen warnings about docstrings the compiler
      # read differently than they were meant, and every build exited 0, so
      # the seventeenth would have gone past too.
      - name: Check that the package compiles without a warning
        run: pixi run check-warnings
      # Every check above reads `src/`. What a reader installs is
      # `dist/libc.mojoc`, so this builds it and imports every public name
      # through the package -- the file the lint job points at `src/`, aimed
      # at the artifact instead.
      - name: Check that every name imports through the package
        run: pixi run check-package
      # Two platforms, because half the work this does is deciding which
      # side of an `if is_macos()` is the true one: neither job can check
      # the branch it is not standing on.

  conda-build:
    name: Conda package
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.11.0
        with:
          cache: true
          environments: build
      - name: Build the conda package
        run: pixi run -e build build-conda
      - uses: actions/upload-artifact@v4
        with:
          name: conda-package
          path: output/**/*.conda

  docs:
    name: Docs
    runs-on: ubuntu-latest
    # The site is what a reader meets before any of this: it went four
    # releases telling them `-c mojo-force`, and the correction sat on main
    # unread because only a tag deployed. A push to main deploys as well, and
    # the group keeps this job and the release's deploy off each other's
    # branch.
    permissions:
      contents: write
    concurrency:
      group: pages
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: prefix-dev/setup-pixi@v0.11.0
        with:
          cache: true
          environments: docs
      - name: Build the site
        run: pixi run -e docs doc-build
      - name: Deploy to GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          pixi run -e docs mkdocs gh-deploy --force
