name: Mutation sample

# `scripts/check-tests.py` asks that every binding be called by a test. It
# cannot ask whether the answer was looked at, and a binding calling the
# wrong symbol passes everything on this list just as quietly -- that took
# `gamma` three releases to notice. `scripts/mutation-probe.py` is the
# witness for it: point a binding at a sibling's symbol (or hand two
# arguments to C the other way round), and see whether any test fails.
#
# The whole sweep is an evening's work and not CI's to pay for, so this runs
# a sample: the same mutants every run -- one seed, spread over the modules
# rather than taken from the front -- so two runs of this job answer the
# same question and can be compared. `--strict` makes a survivor, a hang,
# or a table reason whose mutant is now caught fail the job; `flaky` does
# not, the suite having caught it on the asking again, but the note is in
# the log for whoever wants it. A mutant that reaches the sample and
# survives here is a test with no teeth where a binding is wrong -- the
# exact shape of the `gamma` bug.
#
# Weekly and manual, not per push: the answer changes only when the tests
# or the bindings do, and a push job this heavy would be paid on every
# commit for a difference the lint job's `check-tables` already watches.

on:
  schedule:
    # Mondays, 04:23 UTC -- an odd minute, so the cron crush at the top of
    # the hour is somebody else's queue.
    - cron: "23 4 * * 1"
  workflow_dispatch:

concurrency:
  group: mutation-sample
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sample:
    name: Mutation sample (seed 1)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.11.0
        with:
          cache: true
      - name: Ask the symbol axis
        # Four compilations share the runner's four cores, and the slowest
        # test file needs minutes of a contended machine where it needs
        # seconds of an idle one -- the probe's two-minute default is the
        # ceiling for a run that owns the machine, and this one does not.
        env:
          MUTATION_TIMEOUT: "300"
        run: python3 scripts/mutation-probe.py --kind symbol --limit 48 --jobs 4 --strict
      - name: Ask the order axis
        env:
          MUTATION_TIMEOUT: "300"
        run: python3 scripts/mutation-probe.py --kind order --limit 48 --jobs 4 --strict
      - name: Ask the constants axis
        # The axis that caught `gamma`'s neighbours: a constant asked by
        # a machine that reads it one field away, or answered by a branch
        # this runner does not compile. What this runner cannot see --
        # the ARM branch's numbering, the quad `long double` -- is the
        # arm job's half of the same question.
        env:
          MUTATION_TIMEOUT: "300"
        run: python3 scripts/mutation-probe.py --kind constant --limit 48 --jobs 4 --strict

  sample-arm:
    name: Mutation sample, the third machine (seed 1)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.11.0
        with:
          cache: true
      # The constants the first machine cannot see: the ARM branch of
      # every answer the machines took sides on -- the syscall table
      # numbered from the asm-generic set, the flags the thirty-two-bit
      # ABI chose, `char` unsigned. A mutant there is a number no run on
      # x86-64 ever adds up, and this is the runner it adds up on.
      - name: Ask the constants axis
        env:
          MUTATION_TIMEOUT: "300"
        run: python3 scripts/mutation-probe.py --kind constant --limit 48 --jobs 4 --strict

  report:
    # Three machines answer in three logs, and a reader would open all
    # three to learn what the asking came back with. The run says so
    # itself now: the report reads this run's logs and lays every tally
    # out, one line per machine and axis, in the summary a click away.
    name: The answers, side by side
    runs-on: ubuntu-latest
    needs: [sample, sample-arm, sample-macos]
    if: always()
    permissions:
      actions: read
    steps:
      - uses: actions/checkout@v4
      - name: Read the run's answers back
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The step's verdict is the pipe's, and the pipe's is `tee`'s
          # unless the asking's own exit rides along with it.
          set -o pipefail
          python3 scripts/sample-report.py "${{ github.run_id }}" | tee "$GITHUB_STEP_SUMMARY"

  sample-macos:
    name: Mutation sample, the Darwin reader (seed 1)
    runs-on: macos-15
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.11.0
        with:
          cache: true
      # The other half of the same question, on the machine that compiles
      # the branches the Linux runners never read: the Darwin numbering,
      # the refusals Darwin spells differently, the slots Darwin makes
      # wider. What the x86-64 sample excuses as a branch this machine
      # does not compile, this machine compiles -- and the same two
      # checks that ask C on Linux ask C here. Two workers, the runner
      # having three cores and the compilations being slower ones.
      # The probe's own verdicts are pinned to two mutants this machine's
      # sweep has settled, and the Darwin ones are not the Linux ones: the
      # member the tables carry here is `O_RSYNC`, which no asking here
      # reads. The same self-test that the checks job runs on Linux runs
      # here first, so the pinned pair is the pair the machine proves.
      - name: Ask the probe of the two mutants the answer is known for
        run: python3 scripts/mutation-probe.py --self-test
      - name: Ask the constants axis
        env:
          MUTATION_TIMEOUT: "300"
        run: python3 scripts/mutation-probe.py --kind constant --limit 48 --jobs 2 --strict
