# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json

context:
  version: "0.12.0"

package:
  name: libc
  version: ${{ version }}

source:
  - path: ../src
  - path: ../tests
    target_directory: tests
  - path: ../LICENSE
  - path: ../pixi.toml
  - path: ../pixi.lock

build:
  script:
    - mkdir -p ${PREFIX}/lib/mojo
    # `mojo precompile` emits the 1.x package format (.mojoc); .mojopkg was
    # removed in Mojo 1.1.
    - mojo precompile libc -o ${PREFIX}/lib/mojo/libc.mojoc

requirements:
  build:
    - mojo >=1.1.0,<2
  run:
    - mojo >=1.1.0,<2

tests:
  - script:
      # The suite is run against the sources, the way it is run in the
      # repository, and not against the precompiled package, which is
      # what used to be done here.
      #
      # It cannot be done that way any more. This package binds `write`,
      # and so does the standard library — twice, in fact, and not with
      # the same signature: `std.sys._libc` has it returning a `c_int`
      # and `std.io.file_descriptor` a `c_ssize_t`. Where a programme
      # reaches both, the compiler objects to there being two and throws
      # one out, and a suite that writes to the terminal reaches both.
      # That is the standard library's own doing, and there is nothing a
      # binding can change about it.
      #
      # The package is still checked, by the second command below: it is
      # a programme small enough not to reach either of those two, which
      # is to say one that does not write to the terminal.
      - mojo run -I . -I tests tests/test_main.mojo
      - mojo run -I ${PREFIX}/lib/mojo -I tests tests/test_smoke.mojo
    files:
      source:
        - tests

about:
  homepage: https://github.com/mojothon/libc
  repository: https://github.com/mojothon/libc
  documentation: https://mojothon.github.io/libc/
  license: MIT
  license_file: LICENSE
  summary: A standard C library binding for the Mojo programming language.
