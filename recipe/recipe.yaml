# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json

context:
  version: "0.12.0"

package:
  name: libc
  version: ${{ version }}

source:
  - path: ../src
  - path: ../tests
    target_directory: tests
  - path: ../LICENSE
  - path: ../pixi.toml
  - path: ../pixi.lock

build:
  script:
    - mkdir -p ${PREFIX}/lib/mojo
    # `mojo precompile` emits the 1.x package format (.mojoc); .mojopkg was
    # removed in Mojo 1.1.
    - mojo precompile libc -o ${PREFIX}/lib/mojo/libc.mojoc

requirements:
  build:
    - mojo >=1.1.0,<2
  run:
    - mojo >=1.1.0,<2

tests:
  - script:
      # The whole suite is not run here, and it is not run against the
      # sources either, which is what was tried first. It cannot be.
      #
      # This package binds `write`. So does the standard library, twice
      # over, and the two do not agree: one has it returning a `c_int`
      # and the other a `c_ssize_t`. Where a programme reaches both, the
      # compiler objects to there being two and throws one of them out,
      # and anything that writes to the terminal reaches both, since
      # `print` is what gets there. The suite writes to the terminal
      # all the way through.
      #
      # Whether it does depends on which build of the compiler is
      # installed, which is why this passes here and not on the mojo
      # that conda resolves — but it is not this package's to fix, and
      # not something that can be worked on where it cannot be seen.
      #
      # So the built package is checked with a programme that says
      # nothing: found, loaded and called is what is worth knowing
      # here. The suite itself is run, against the sources, by the two
      # test jobs above.
      - mojo run -I ${PREFIX}/lib/mojo -I tests tests/test_smoke.mojo
    files:
      source:
        - tests

about:
  homepage: https://github.com/mojothon/libc
  repository: https://github.com/mojothon/libc
  documentation: https://mojothon.github.io/libc/
  license: MIT
  license_file: LICENSE
  summary: A standard C library binding for the Mojo programming language.
