[workspace]
name = "libc"
version = "0.13.0"
description = "A standard C library binding for the Mojo programming language."
authors = ["llango <rontomai@gmail.com>"]
channels = ["https://conda.modular.com/max", "conda-forge"]
platforms = ["linux-64", "osx-arm64"]

[dependencies]
mojo = ">=1.1.0,<2"

[tasks]
test = "mojo run -I src -I tests tests/test_main.mojo"
# `mojo precompile` will not create the output directory.
package = "mkdir -p dist && mojo precompile src/libc -o dist/libc.mojoc"
# The compiler reads the docstrings too, and warns where it reads one
# differently than it was meant: sixteen had collected, printed by every
# build and failing none of them. `check-docstrings` parses the same
# sections by hand and never saw them, so this asks the compiler.
check-warnings = "python3 scripts/check-warnings.py"
# Every check above is a claim that something bad would be caught, and
# nothing checks the claim: `check-channels` passed by finding no channel
# names at all. This breaks one thing at a time on a copy of the tree and
# asks the check that owns it to say so.
check-checks = "python3 scripts/check-checks.py"
# Every other check reads `src/`. What a reader installs is `dist/libc.mojoc`,
# and nothing asked whether the package holds what the tree does: a name
# `precompile` drops, or a sub-package it does not carry, would pass all of
# them. This builds the package and imports every public name through it --
# the same file the lint job runs against the source tree, pointed at the
# artifact instead.
check-package = { cmd = "mojo run -I dist -I tests tests/test_import_all.mojo", depends-on = [
    "package",
] }
run = "mojo run -I src src/main.mojo"
format = "mojo format src tests"
# `mojo format` has no --check flag, so format a copy and diff it.
format-check = "bash scripts/format-check.sh"
# `external_call` takes whatever types it is given, so a wrong argument
# count or a misspelled symbol still compiles. This checks them against
# the real prototypes read out of the headers with `gcc -aux-info`.
check-prototypes = "python3 scripts/check-prototypes.py"
# One file per C symbol. Two modules can bind the same call to two
# signatures that look alike and are not: `strlen` answered `UInt64` in
# `libc.string` and `Int` in `libc.utils`, `read` took `c_ptr[c_void]` in
# one place and `c_ptr[UInt8]` in another, and `ldiv` read `long` in one
# module and `Int64` in the other, each with a `ldiv_t` of its own. Every
# copy compiled and every copy was tested, so nothing compared them, and
# the copy a bug was found in got fixed while the other kept it. A module
# that wants to offer a call another module owns imports it instead.
# And one signature per symbol, which is the same mistake one step in: `fcntl`
# was bound with the two arguments a caller may give it and with the three its
# commands take, each form right about itself, and a program that called both
# stopped at lowering with `existing function with conflicting signature` --
# a message that names the symbol and not the call written second. A form C
# makes variadic is declared with the arguments it always takes instead.
check-duplicates = "python3 scripts/check-duplicates.py"
# Not a gate: every mutant is a rebuild of the package and a suite run, so it
# samples. It points one binding at a same-signature sibling's symbol and asks
# whether any test notices -- `check-tests` only asks that a binding be
# called, and `_ = f(...)` counts, so a test that throws the answer away is
# green against the wrong function. `--limit` for more, `--only` for named
# bindings, `--strict` to fail on a survivor that is not a known pair.
mutation-probe = "python3 scripts/mutation-probe.py"
mutation-tables = "python3 scripts/mutation-probe.py --check-tables"
# Every numeric constant here was read out of `gcc -dM` by eye, once, and
# a number nobody rechecks is a number nothing stops from being wrong: 55
# of them were Darwin's values with no platform branch at all, which is
# to say they were wrong on Linux and looked correct. Each one is printed
# by C and compared now, and because the platform decides which side of a
# conditional is on trial, this has to run on both for either to count.
check-constants = "python3 scripts/check-constants.py"
# Size and alignment of every struct, asked of C rather than remembered.
# A struct smaller than C's is a hole punched in whatever follows it; one
# less aligned than C asks for is a pointer handed to libc that libc never
# agreed to accept. Bigger than C needs is fine, and half of them are, on
# purpose: they hold whichever of the two platforms wanted most.
check-layouts = "python3 scripts/check-layouts.py"
check-symbols = "python3 scripts/check-symbols.py"
# What a binding says it hands back is what everybody calling it tests, and
# nothing else reads those lines: they are wishes written above each
# `external_call`. Fifteen here once said "0 on success" for calls whose
# answer was bytes, a descriptor, or which branch of `fork` you were now
# in — and the ones that mislead are the ones that are nearly right, like
# `write` stopping short, which is success having left part of what it was
# given unsent. Two of the three rules are settled by asking gcc what the
# return type is; the third cannot be, and carries a list of names instead.
check-return-values = "python3 scripts/check-return-values.py"
# A docstring is read by nothing but whoever reads it, so what is wrong in
# one stays wrong until somebody asks. This asks three things: that every
# name under `Args` is a parameter the function takes, that the prototype
# names the function actually called, and that it takes as many arguments.
# Everything it has found was a copy that kept the wrong heading — `atan`
# carrying `atan2`'s prototype, and with it a second argument `y` that it
# cannot be given; `ldiv`, `lldiv` and `imaxdiv` all saying `div`.
check-docstrings = "python3 scripts/check-docstrings.py"
# The documentation is the one place in this repository where a call is
# written and nothing compiles it. A rename leaves an example naming a
# function that no longer exists, and the first person to find out is a
# reader following it. Every fenced `mojo` block is built against `src/`
# now — built rather than run, since two of them print whichever directory
# entry comes first and none asserts an answer. A block that is a fragment
# rather than a program is fenced `mojo fragment`, and the count of those is
# printed so that skipping is something the run says rather than something
# a fence can do quietly.
check-examples = "python3 scripts/check-examples.py"
# Has to be its own process: imported, Mojo drops every import in it.
test-imports = "mojo run -I src -I tests tests/test_import_all.mojo"
check-comparisons = "python3 scripts/check-comparisons.py"
check-magnitudes = "python3 scripts/check-magnitudes.py"
# A binding nobody calls is a binding nothing checks. `gl_flags` was read
# from the wrong half of a word for three releases while every check here
# was green: the offset was the one the module named, the symbol was the
# one the header exported, and no test ever gave `glob` a flag. This walks
# the same bindings `check-prototypes` does and asks `tests/` which ones it
# calls, lists the rest with the reason each cannot be asked, and fails
# when a binding arrives with neither a test nor a reason. The remainder —
# testable and untested — is a list with a number on it, and fails only if
# it grows.
check-tests = "python3 scripts/check-tests.py"
# Five places state the version and four state the Mojo range, and a
# release is where a number gets bumped in the four somebody remembered.
# Nothing about the package breaks when one is left behind, which is why
# nothing caught it: the docs build, the tests pass, and the install page
# goes on telling readers to ask for a release that is two bumps old.
# This compares them, and asks whether the version this checkout is
# actually satisfies what the install page says to ask for.
check-release = "python3 scripts/check-release.py"
# The install page named the channel three ways and two of them were wrong:
# `-c mojo-force` and `"mojo-force"` are read as anaconda.org channels, where
# there is none, while the package was on prefix.dev behind a URL. Nothing
# compiles a shell command, so the page said it for four releases. This asks
# the one thing that can be asked without the network: is every channel the
# docs name a URL, or a name that really does answer on anaconda.org?
check-channels = "python3 scripts/check-channels.py"

[feature.build.dependencies]
rattler-build = ">=0.40,<0.41"

[feature.build.tasks]
build-conda = "rattler-build build --recipe recipe -c https://conda.modular.com/max -c conda-forge --skip-existing=all"
publish = { cmd = "bash scripts/publish.sh", env = { PREFIX_API_KEY = "$PREFIX_API_KEY" } }

[feature.docs.dependencies]
python = ">=3.11,<3.14"
mkdocs = ">=1.6,<2"
mkdocs-material = ">=9.5,<10"

[feature.docs.tasks]
doc = "mkdocs serve"
doc-build = "mkdocs build --strict"

[environments]
build = ["build"]
docs = ["docs"]
