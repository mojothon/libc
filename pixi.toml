[workspace]
name = "libc"
version = "0.12.0"
description = "A standard C library binding for the Mojo programming language."
authors = ["llango <rontomai@gmail.com>"]
channels = ["https://conda.modular.com/max", "conda-forge"]
platforms = ["linux-64", "osx-arm64"]

[dependencies]
mojo = ">=1.1.0,<2"

[tasks]
test = "mojo run -I src -I tests tests/test_main.mojo"
# `mojo precompile` will not create the output directory.
package = "mkdir -p dist && mojo precompile src/libc -o dist/libc.mojoc"
run = "mojo run -I src src/main.mojo"
format = "mojo format src tests"
# `mojo format` has no --check flag, so format a copy and diff it.
format-check = "bash scripts/format-check.sh"
# `external_call` takes whatever types it is given, so a wrong argument
# count or a misspelled symbol still compiles. This checks them against
# the real prototypes read out of the headers with `gcc -aux-info`.
check-prototypes = "python3 scripts/check-prototypes.py"
# Every numeric constant here was read out of `gcc -dM` by eye, once, and
# a number nobody rechecks is a number nothing stops from being wrong: 55
# of them were Darwin's values with no platform branch at all, which is
# to say they were wrong on Linux and looked correct. Each one is printed
# by C and compared now, and because the platform decides which side of a
# conditional is on trial, this has to run on both for either to count.
check-constants = "python3 scripts/check-constants.py"
# Size and alignment of every struct, asked of C rather than remembered.
# A struct smaller than C's is a hole punched in whatever follows it; one
# less aligned than C asks for is a pointer handed to libc that libc never
# agreed to accept. Bigger than C needs is fine, and half of them are, on
# purpose: they hold whichever of the two platforms wanted most.
check-layouts = "python3 scripts/check-layouts.py"
check-symbols = "python3 scripts/check-symbols.py"
# What a binding says it hands back is what everybody calling it tests, and
# nothing else reads those lines: they are wishes written above each
# `external_call`. Fifteen here once said "0 on success" for calls whose
# answer was bytes, a descriptor, or which branch of `fork` you were now
# in — and the ones that mislead are the ones that are nearly right, like
# `write` stopping short, which is success having left part of what it was
# given unsent. Two of the three rules are settled by asking gcc what the
# return type is; the third cannot be, and carries a list of names instead.
check-return-values = "python3 scripts/check-return-values.py"
# A docstring is read by nothing but whoever reads it, so what is wrong in
# one stays wrong until somebody asks. This asks three things: that every
# name under `Args` is a parameter the function takes, that the prototype
# names the function actually called, and that it takes as many arguments.
# Everything it has found was a copy that kept the wrong heading — `atan`
# carrying `atan2`'s prototype, and with it a second argument `y` that it
# cannot be given; `ldiv`, `lldiv` and `imaxdiv` all saying `div`.
check-docstrings = "python3 scripts/check-docstrings.py"

[feature.build.dependencies]
rattler-build = ">=0.40,<0.41"

[feature.build.tasks]
build-conda = "rattler-build build --recipe recipe -c https://conda.modular.com/max -c conda-forge --skip-existing=all"
publish = { cmd = "bash scripts/publish.sh", env = { PREFIX_API_KEY = "$PREFIX_API_KEY" } }

[feature.docs.dependencies]
python = ">=3.11,<3.14"
mkdocs = ">=1.6,<2"
mkdocs-material = ">=9.5,<10"

[feature.docs.tasks]
doc = "mkdocs serve"
doc-build = "mkdocs build --strict"

[environments]
build = ["build"]
docs = ["docs"]
